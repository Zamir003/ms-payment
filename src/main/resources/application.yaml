server:
  port: 8051

spring:
  application:
    name: ms-payment
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: "1"
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        default_schema: payment
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

clients:
  customer:
    base-url: http://localhost:8053